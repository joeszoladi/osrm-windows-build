name: Build OSRM v5.26.0 Windows Runtime

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-osrm-windows:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Download OSRM v5.26.0 source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git --version
          git clone --depth 1 --branch v5.26.0 https://github.com/Project-OSRM/osrm-backend.git .
          git rev-parse --short HEAD

      - name: Show runner and Visual Studio info
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "OS:" (Get-CimInstance Win32_OperatingSystem).Caption
          Write-Host "Processor count:" $env:NUMBER_OF_PROCESSORS
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "vswhere.exe not found" }
          & $vswhere -all -products * -format table
          & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmake --version
          7z

      - name: Download OSRM v5.26 Windows dependency package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "http://project-osrm.wolt.com/windows-build-deps/osrm-deps-win-x64-14.2-2019.01.7z"
          $out = "osrm-deps-win-x64-14.2-2019.01.7z"
          Write-Host "Downloading $url"
          Invoke-WebRequest $url -OutFile $out -UseBasicParsing
          if (!(Test-Path $out)) { throw "Dependency package did not download" }
          Write-Host "Downloaded bytes:" (Get-Item $out).Length
          7z x $out -y
          if (!(Test-Path "osrm-deps\lib")) { throw "osrm-deps did not extract correctly" }
          Write-Host "Dependency DLLs found:"
          Get-ChildItem "osrm-deps\lib\*.dll" -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table -AutoSize

      - name: Configure OSRM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = (Get-Location).Path
          $deps = Join-Path $project "osrm-deps"
          $env:TBB_INSTALL_DIR = $deps
          $env:PATH = "$deps\lib;$env:PATH"

          New-Item -ItemType Directory -Force build | Out-Null
          Set-Location build

          cmake .. `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -T v142 `
            -DBOOST_ROOT="$deps" `
            -DBOOST_LIBRARYDIR="$deps/lib" `
            -DBoost_ADDITIONAL_VERSIONS=1.73.0 `
            -DBoost_USE_MULTITHREADED=ON `
            -DBoost_USE_STATIC_LIBS=ON `
            -DEXPAT_INCLUDE_DIR="$deps" `
            -DEXPAT_LIBRARY="$deps/lib/libexpat.lib" `
            -DBZIP2_INCLUDE_DIR="$deps" `
            -DBZIP2_LIBRARIES="$deps/lib/libbz2.lib" `
            -DLUA_INCLUDE_DIR="$deps" `
            -DLUA_LIBRARIES="$deps/lib/lua5.3.5.lib" `
            -DZLIB_INCLUDE_DIR="$deps" `
            -DZLIB_LIBRARY="$deps/lib/libz.lib" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$deps/libs"

      - name: Build osrm-routed
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location build
          cmake --build . --config Release --target osrm-routed -- /m /verbosity:minimal

      - name: Package runtime folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path (Get-Location).Path "dist\osrm"
          New-Item -ItemType Directory -Force $dist | Out-Null

          $exe = Get-ChildItem -Path . -Recurse -Filter osrm-routed.exe | Select-Object -First 1
          if (!$exe) { throw "osrm-routed.exe was not found after build" }
          Copy-Item $exe.FullName $dist -Force

          Copy-Item "osrm-deps\lib\*.dll" $dist -Force -ErrorAction SilentlyContinue

          $vcRuntimeNames = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "concrt140.dll")
          foreach ($name in $vcRuntimeNames) {
            $src = Join-Path $env:WINDIR "System32\$name"
            if (Test-Path $src) { Copy-Item $src $dist -Force }
          }

          Get-ChildItem $dist | Sort-Object Name | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Set-Content (Join-Path $dist "RUNTIME_FILES.txt")
          Get-ChildItem $dist | Sort-Object Name | ForEach-Object { $_.Name }

      - name: Upload OSRM Windows runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: osrm-v5.26.0-windows-x64-runtime
          path: dist/osrm/**
          if-no-files-found: error
