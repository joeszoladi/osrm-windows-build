name: Build OSRM v5.26.0 Windows Runtime

on:
  workflow_dispatch:

jobs:
  build-osrm-windows:
    runs-on: windows-2022

    steps:
      - name: Download OSRM v5.26.0 source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git clone --branch v5.26.0 --depth 1 https://github.com/Project-OSRM/osrm-backend.git C:\osrm-src
          cd C:\osrm-src
          git rev-parse HEAD

      - name: Show runner and Visual Studio info
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Runner OS: $env:RUNNER_OS"
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -property installationPath
          cmake --version
          git --version

      - name: Install vcpkg dependencies except old TBB
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          $env:VCPKG_ROOT = "C:\vcpkg"
          C:\vcpkg\vcpkg.exe version

          # OSRM 5.26 is old. These are the modern vcpkg ports/features needed to satisfy
          # its older CMake files as closely as possible.
          C:\vcpkg\vcpkg.exe install --triplet x64-windows `
            boost-algorithm `
            boost-align `
            boost-assert `
            boost-chrono `
            boost-date-time `
            boost-filesystem `
            boost-foreach `
            boost-geometry `
            boost-iostreams[zlib,bzip2] `
            boost-lexical-cast `
            boost-math `
            boost-program-options `
            boost-regex `
            boost-system `
            boost-thread `
            boost-uuid `
            boost-variant `
            bzip2 `
            expat `
            gtest `
            libosmium `
            lua `
            luabind `
            protozero `
            stxxl `
            zlib

          Write-Host "Installed vcpkg packages:"
          C:\vcpkg\vcpkg.exe list
          Write-Host "Installed share folders:"
          Get-ChildItem "C:\vcpkg\installed\x64-windows\share" -Directory | Select-Object -ExpandProperty Name | Sort-Object

      - name: Build old TBB 2020.2 for OSRM v5.26
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git clone --branch 2020_U2 --depth 1 https://github.com/oneapi-src/oneTBB.git C:\tbb-src
          cd C:\tbb-src

          # Old TBB uses makefiles. Use the Visual Studio environment supplied by the runner.
          $vsPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio with VC tools was not found." }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat was not found at $vcvars" }

          cmd /c "`"$vcvars`" && cd /d C:\tbb-src && mingw32-make compiler=cl arch=intel64 runtime=vc14"

          $tbbBuild = Get-ChildItem C:\tbb-src\build -Directory | Where-Object { $_.Name -like "windows_intel64*release*" } | Select-Object -First 1
          if (-not $tbbBuild) { throw "Could not find old TBB release build folder." }

          New-Item -ItemType Directory -Force C:\tbb-install\include | Out-Null
          New-Item -ItemType Directory -Force C:\tbb-install\lib | Out-Null
          New-Item -ItemType Directory -Force C:\tbb-install\bin | Out-Null

          Copy-Item C:\tbb-src\include\* C:\tbb-install\include\ -Recurse -Force
          Copy-Item "$($tbbBuild.FullName)\*.lib" C:\tbb-install\lib\ -Force
          Copy-Item "$($tbbBuild.FullName)\*.dll" C:\tbb-install\bin\ -Force

          Write-Host "TBB build folder: $($tbbBuild.FullName)"
          Get-ChildItem C:\tbb-install -Recurse | Select-Object FullName

      - name: Patch OSRM v5.26 CMake for modern GitHub runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cmakeFile = "C:\osrm-src\CMakeLists.txt"
          $text = Get-Content $cmakeFile -Raw

          # Old OSRM asks Boost to find old zlib/bzip2 pseudo-components.
          # Modern vcpkg exposes these through boost-iostreams features instead.
          $text = $text -replace "(?m)^\s*zlib\s*$", ""
          $text = $text -replace "(?m)^\s*bzip2\s*$", ""

          # Do not generate the old pkg-config file. It uses TARGET_LINKER_FILE on Boost targets,
          # which modern vcpkg/CMake imported Boost targets do not expose as real libraries.
          $text = $text -replace "(?s)configure_file\([^\)]*libosrm\.pc\.in[^\)]*\)", "# patched out for GitHub Actions Windows runtime build"

          # Do not configure tests/benchmarks. We only need osrm-routed.exe for the app runtime.
          $text = $text -replace "(?m)^\s*add_subdirectory\(unit_tests\)\s*$", "# patched out: add_subdirectory(unit_tests)"
          $text = $text -replace "(?m)^\s*add_subdirectory\(src/benchmarks\)\s*$", "# patched out: add_subdirectory(src/benchmarks)"

          Set-Content $cmakeFile $text -Encoding UTF8

          # Compatibility CMake module for old OSRM + modern vcpkg imported targets.
          $compat = @'
          message(STATUS "Applying OSRM 5.26 Windows compatibility targets")
          find_package(Threads REQUIRED)
          find_package(ZLIB REQUIRED)
          find_package(BZip2 REQUIRED)
          
          if(NOT TARGET Boost::zlib)
            add_library(Boost::zlib INTERFACE IMPORTED)
            target_link_libraries(Boost::zlib INTERFACE ZLIB::ZLIB)
          endif()
          if(NOT TARGET Boost::bzip2)
            add_library(Boost::bzip2 INTERFACE IMPORTED)
            target_link_libraries(Boost::bzip2 INTERFACE BZip2::BZip2)
          endif()
          if(NOT TARGET boost_zlib)
            add_library(boost_zlib INTERFACE IMPORTED)
            target_link_libraries(boost_zlib INTERFACE ZLIB::ZLIB)
          endif()
          if(NOT TARGET boost_bzip2)
            add_library(boost_bzip2 INTERFACE IMPORTED)
            target_link_libraries(boost_bzip2 INTERFACE BZip2::BZip2)
          endif()
          
          if(NOT TARGET TBB::tbb AND DEFINED TBB_LIBRARY AND DEFINED TBB_INCLUDE_DIR)
            add_library(TBB::tbb UNKNOWN IMPORTED)
            set_target_properties(TBB::tbb PROPERTIES
              IMPORTED_LOCATION "${TBB_LIBRARY}"
              INTERFACE_INCLUDE_DIRECTORIES "${TBB_INCLUDE_DIR}")
          endif()
          if(NOT TARGET TBB::tbbmalloc AND DEFINED TBB_MALLOC_LIBRARY AND DEFINED TBB_INCLUDE_DIR)
            add_library(TBB::tbbmalloc UNKNOWN IMPORTED)
            set_target_properties(TBB::tbbmalloc PROPERTIES
              IMPORTED_LOCATION "${TBB_MALLOC_LIBRARY}"
              INTERFACE_INCLUDE_DIRECTORIES "${TBB_INCLUDE_DIR}")
          endif()
          '@
          Set-Content "C:\osrm-src\cmake\github-actions-compat.cmake" $compat -Encoding UTF8

          # Include the compatibility module near the top after project() if possible.
          $text = Get-Content $cmakeFile -Raw
          if ($text -notmatch "github-actions-compat.cmake") {
            $text = $text -replace "(?m)^(project\([^\r\n]+\)\s*)$", "`$1`r`ninclude(\`${CMAKE_CURRENT_SOURCE_DIR}/cmake/github-actions-compat.cmake\`)"
            if ($text -notmatch "github-actions-compat.cmake") {
              $text = "include(\`${CMAKE_CURRENT_SOURCE_DIR}/cmake/github-actions-compat.cmake\`)`r`n" + $text
            }
            Set-Content $cmakeFile $text -Encoding UTF8
          }

          Write-Host "Patched CMakeLists snippets:"
          Select-String -Path $cmakeFile -Pattern "github-actions-compat|unit_tests|benchmarks|libosrm.pc|zlib|bzip2" -Context 1,1

      - name: Configure OSRM with vcpkg dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force C:\osrm-build | Out-Null

          $tbbLib = "C:\tbb-install\lib\tbb.lib"
          $tbbMallocLib = "C:\tbb-install\lib\tbbmalloc.lib"
          if (-not (Test-Path $tbbLib)) { throw "Missing $tbbLib" }
          if (-not (Test-Path $tbbMallocLib)) { throw "Missing $tbbMallocLib" }
          Write-Host "Using TBB_LIBRARY=$tbbLib"
          Write-Host "Using TBB_LIBRARY_DEBUG=$tbbLib"
          Write-Host "Using TBB_MALLOC_LIBRARY=$tbbMallocLib"
          Write-Host "Using TBB_MALLOC_LIBRARY_DEBUG=$tbbMallocLib"

          cmake -S C:\osrm-src -B C:\osrm-build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DTBB_INCLUDE_DIR=C:\tbb-install\include `
            -DTBB_INCLUDE_DIRS=C:\tbb-install\include `
            -DTBB_LIBRARY=$tbbLib `
            -DTBB_LIBRARY_RELEASE=$tbbLib `
            -DTBB_LIBRARY_DEBUG=$tbbLib `
            -DTBB_MALLOC_LIBRARY=$tbbMallocLib `
            -DTBB_MALLOC_LIBRARY_RELEASE=$tbbMallocLib `
            -DTBB_MALLOC_LIBRARY_DEBUG=$tbbMallocLib `
            -DTBB_MALLOC_PROXY_LIBRARY=$tbbMallocLib `
            -DTBB_MALLOC_PROXY_LIBRARY_RELEASE=$tbbMallocLib `
            -DTBB_MALLOC_PROXY_LIBRARY_DEBUG=$tbbMallocLib `
            -DBUILD_TESTING=OFF `
            -DENABLE_TESTS=OFF `
            -DENABLE_BENCHMARKS=OFF `
            -DENABLE_ASSERTIONS=OFF `
            -DENABLE_LTO=OFF `
            -DENABLE_CCACHE=OFF `
            -DBoost_NO_WARN_NEW_VERSIONS=ON `
            -DBOOST_LIBRARYDIR=C:\vcpkg\installed\x64-windows\lib `
            -DBOOST_INCLUDEDIR=C:\vcpkg\installed\x64-windows\include

      - name: Build osrm-routed
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build C:\osrm-build --config Release --target osrm-routed --parallel 2

      - name: Package runtime folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force C:\osrm-runtime | Out-Null

          $exe = Get-ChildItem C:\osrm-build -Recurse -Filter osrm-routed.exe | Select-Object -First 1
          if (-not $exe) { throw "osrm-routed.exe was not found." }
          Copy-Item $exe.FullName C:\osrm-runtime\ -Force

          # Copy DLLs from the executable folder, vcpkg runtime bin, and old TBB runtime bin.
          Copy-Item (Join-Path $exe.Directory.FullName "*.dll") C:\osrm-runtime\ -Force -ErrorAction SilentlyContinue
          Copy-Item C:\vcpkg\installed\x64-windows\bin\*.dll C:\osrm-runtime\ -Force -ErrorAction SilentlyContinue
          Copy-Item C:\tbb-install\bin\*.dll C:\osrm-runtime\ -Force -ErrorAction SilentlyContinue

          $runtimeReadme = @"
          OSRM Windows runtime built by GitHub Actions.
          Version: v5.26.0
          Copy every file in this artifact into TransportationDesktop\osrm\
          Then put canada-latest.osrm* into TransportationDesktop\osrm\data\
          "@
          Set-Content C:\osrm-runtime\RUNTIME_FILES.txt $runtimeReadme -Encoding UTF8

          Get-ChildItem C:\osrm-runtime | Select-Object Name,Length

      - name: Upload OSRM Windows runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: osrm-v5.26.0-windows-x64-runtime
          path: C:\osrm-runtime\*
          if-no-files-found: error
