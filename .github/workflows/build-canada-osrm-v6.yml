name: Build OSRM v6 Map Files

on:
  workflow_dispatch:
    inputs:
      pbf_url:
        description: "OSM PBF download URL"
        required: true
        default: "https://download.geofabrik.de/north-america/canada-latest.osm.pbf"
      pbf_name:
        description: "Downloaded PBF filename"
        required: true
        default: "canada-latest.osm.pbf"
      base_name:
        description: "Output OSRM base name used by the Windows app"
        required: true
        default: "canada-latest"

jobs:
  build-osrm-map:
    name: Build OSRM v6 MLD map artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Show build machine info
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(uname -a)"
          docker --version
          df -h

      - name: Prepare folders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data artifact

      - name: Download OSM PBF
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 10 --connect-timeout 30 \
            -o "data/${{ inputs.pbf_name }}" \
            "${{ inputs.pbf_url }}"
          ls -lh data

      - name: Pull OSRM v6 Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/project-osrm/osrm-backend:v6.0.0

      - name: Extract OSRM graph
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}/data:/data" \
            ghcr.io/project-osrm/osrm-backend:v6.0.0 \
            osrm-extract -p /opt/car.lua "/data/${{ inputs.pbf_name }}"
          ls -lh data | tail -80

      - name: Normalize OSRM base filename
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          PBF_NAME="${{ inputs.pbf_name }}"
          SRC_BASE="${PBF_NAME%.osm.pbf}"
          OUT_BASE="${{ inputs.base_name }}"

          echo "Source base: ${SRC_BASE}"
          echo "Output base: ${OUT_BASE}"

          if [ "${SRC_BASE}" != "${OUT_BASE}" ]; then
            files=(data/${SRC_BASE}.osrm*)
            if [ ${#files[@]} -eq 0 ]; then
              echo "ERROR: No files found matching data/${SRC_BASE}.osrm*"
              ls -lh data
              exit 1
            fi

            for file in "${files[@]}"; do
              new_file="data/${OUT_BASE}${file#data/${SRC_BASE}}"
              echo "Renaming ${file} -> ${new_file}"
              mv "${file}" "${new_file}"
            done
          fi

          files=(data/${OUT_BASE}.osrm*)
          echo "OSRM file count after extract/normalize: ${#files[@]}"
          if [ ${#files[@]} -lt 5 ]; then
            echo "ERROR: Not enough OSRM files were created. Expected files matching data/${OUT_BASE}.osrm*"
            ls -lh data
            exit 1
          fi

          # OSRM v6 may not create a plain `${OUT_BASE}.osrm` file.
          # The `.osrm` argument is still used as a base path by osrm-partition/customize/routed.
          ls -lh "${files[@]}"

      - name: Partition OSRM graph
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}/data:/data" \
            ghcr.io/project-osrm/osrm-backend:v6.0.0 \
            osrm-partition "/data/${{ inputs.base_name }}.osrm"
          ls -lh data/${{ inputs.base_name }}.osrm* | tail -120

      - name: Customize OSRM graph
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}/data:/data" \
            ghcr.io/project-osrm/osrm-backend:v6.0.0 \
            osrm-customize "/data/${{ inputs.base_name }}.osrm"
          ls -lh data/${{ inputs.base_name }}.osrm* | tail -120

      - name: Verify and stage OSRM v6 dataset
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          BASE="${{ inputs.base_name }}"
          files=(data/${BASE}.osrm*)

          echo "OSRM dataset file count: ${#files[@]}"
          if [ ${#files[@]} -lt 10 ]; then
            echo "ERROR: OSRM dataset is incomplete."
            ls -lh data
            exit 1
          fi

          required=(
            "${BASE}.osrm.properties"
            "${BASE}.osrm.geometry"
            "${BASE}.osrm.ramIndex"
            "${BASE}.osrm.fileIndex"
            "${BASE}.osrm.partition"
            "${BASE}.osrm.cells"
            "${BASE}.osrm.cell_metrics"
          )

          for required_file in "${required[@]}"; do
            if [ ! -f "data/${required_file}" ]; then
              echo "ERROR: Missing required OSRM v6 file: data/${required_file}"
              ls -lh data/${BASE}.osrm* || true
              exit 1
            fi
          done

          # Docker creates the OSRM files as root. Some v6 files can be unreadable
          # by the GitHub runner user, which breaks staging/upload unless we fix perms.
          sudo chmod a+r data/${BASE}.osrm*
          sudo chown $(id -u):$(id -g) data/${BASE}.osrm*

          cp -a data/${BASE}.osrm* artifact/
          chmod a+r artifact/${BASE}.osrm*
          (cd artifact && sha256sum ${BASE}.osrm* > MANIFEST-SHA256.txt)
          (cd artifact && ls -lh ${BASE}.osrm* MANIFEST-SHA256.txt | tee FILES-IN-ARTIFACT.txt)

      - name: Smoke test OSRM v6 map
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ inputs.base_name }}"
          docker rm -f osrm-smoke-test 2>/dev/null || true
          docker run -d --name osrm-smoke-test \
            -p 5000:5000 \
            -v "${PWD}/data:/data" \
            ghcr.io/project-osrm/osrm-backend:v6.0.0 \
            osrm-routed --algorithm mld "/data/${BASE}.osrm"

          trap 'docker logs osrm-smoke-test || true; docker rm -f osrm-smoke-test 2>/dev/null || true' EXIT

          echo "Waiting for osrm-routed..."
          for i in $(seq 1 90); do
            if docker logs osrm-smoke-test 2>&1 | grep -q "running and waiting for requests"; then
              break
            fi
            sleep 2
          done

          docker logs osrm-smoke-test || true

          echo "Testing nearest in Ottawa..."
          curl -fsS "http://127.0.0.1:5000/nearest/v1/driving/-75.6972,45.4215?number=1" | tee artifact/SMOKE-NEAREST-OTTAWA.json

          echo "Testing route Ottawa to Toronto..."
          curl -fsS "http://127.0.0.1:5000/route/v1/driving/-75.6972,45.4215;-79.3832,43.6532?overview=false" | tee artifact/SMOKE-ROUTE-OTTAWA-TORONTO.json

      - name: Upload OSRM v6 map artifact
        uses: actions/upload-artifact@v4
        with:
          name: osrm-v6-map-${{ inputs.base_name }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
