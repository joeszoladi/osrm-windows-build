name: Build OSRM v6 Map Files

on:
  workflow_dispatch:
    inputs:
      pbf_url:
        description: "OSM PBF download URL"
        required: true
        default: "https://download.geofabrik.de/north-america/canada-latest.osm.pbf"
      pbf_name:
        description: "Downloaded PBF filename"
        required: true
        default: "canada-latest.osm.pbf"
      base_name:
        description: "Output OSRM base name used by the Windows app"
        required: true
        default: "canada-latest"

jobs:
  build-osrm-map:
    name: Build OSRM v6 MLD map artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Show build machine info
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(uname -a)"
          docker --version
          df -h

      - name: Prepare folders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data artifact

      - name: Download OSM PBF
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 10 --connect-timeout 30 \
            -o "data/${{ inputs.pbf_name }}" \
            "${{ inputs.pbf_url }}"
          ls -lh data

      - name: Pull OSRM v6 Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/project-osrm/osrm-backend:v6.0.0

      - name: Extract OSRM graph
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}/data:/data" \
            ghcr.io/project-osrm/osrm-backend:v6.0.0 \
            osrm-extract -p /opt/car.lua "/data/${{ inputs.pbf_name }}"

      - name: Normalize OSRM base filename
        shell: bash
        run: |
          set -euo pipefail
          PBF_NAME="${{ inputs.pbf_name }}"
          SRC_BASE="${PBF_NAME%.osm.pbf}"
          OUT_BASE="${{ inputs.base_name }}"

          echo "Source base: ${SRC_BASE}"
          echo "Output base: ${OUT_BASE}"

          if [ "${SRC_BASE}" != "${OUT_BASE}" ]; then
            shopt -s nullglob
            for file in data/${SRC_BASE}.osrm*; do
              new_file="data/${OUT_BASE}${file#data/${SRC_BASE}}"
              echo "Renaming ${file} -> ${new_file}"
              mv "${file}" "${new_file}"
            done
          fi

          test -f "data/${OUT_BASE}.osrm"
          ls -lh data/${OUT_BASE}.osrm data/${OUT_BASE}.osrm.*

      - name: Partition OSRM graph
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}/data:/data" \
            ghcr.io/project-osrm/osrm-backend:v6.0.0 \
            osrm-partition "/data/${{ inputs.base_name }}.osrm"

      - name: Customize OSRM graph
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}/data:/data" \
            ghcr.io/project-osrm/osrm-backend:v6.0.0 \
            osrm-customize "/data/${{ inputs.base_name }}.osrm"

      - name: Verify and stage full OSRM dataset
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ inputs.base_name }}"

          echo "Required base file: data/${BASE}.osrm"
          test -f "data/${BASE}.osrm"

          echo "Required side files: data/${BASE}.osrm.*"
          count=$(find data -maxdepth 1 -type f -name "${BASE}.osrm.*" | wc -l)
          echo "Side file count: ${count}"
          if [ "${count}" -lt 5 ]; then
            echo "ERROR: OSRM side files are missing."
            exit 1
          fi

          cp "data/${BASE}.osrm" artifact/
          cp data/${BASE}.osrm.* artifact/

          (cd artifact && sha256sum ${BASE}.osrm ${BASE}.osrm.* > MANIFEST-SHA256.txt)
          (cd artifact && ls -lh ${BASE}.osrm ${BASE}.osrm.* MANIFEST-SHA256.txt | tee FILES-IN-ARTIFACT.txt)

      - name: Upload complete OSRM v6 map artifact
        uses: actions/upload-artifact@v6
        with:
          name: osrm-v6-map-${{ inputs.base_name }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
