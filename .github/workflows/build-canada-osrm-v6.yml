name: Build OSRM Canada Map - v6

on:
  workflow_dispatch:
    inputs:
      osrm_image:
        description: "OSRM v6 image to use"
        required: true
        default: "ghcr.io/project-osrm/osrm-backend:v6.0.0"

      pbf_url:
        description: "Canada OSM PBF URL"
        required: true
        default: "https://download.geofabrik.de/north-america/canada-latest.osm.pbf"

      use_custom_profile:
        description: "Use profiles/truck.lua if it exists, otherwise use /opt/car.lua"
        required: true
        type: choice
        options:
          - "yes"
          - "no"
        default: "yes"

jobs:
  build-canada-osrm-v6:
    name: Build Canada OSRM v6 MLD files
    runs-on: ubuntu-24.04
    timeout-minutes: 720

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail

          echo "Disk before cleanup:"
          df -h

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo docker image prune -af || true
          sudo apt-get clean || true

          echo "Disk after cleanup:"
          df -h

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl zstd coreutils

      - name: Prepare folders
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work dist

      - name: Pull OSRM v6 image
        shell: bash
        run: |
          set -euxo pipefail
          docker pull "${{ github.event.inputs.osrm_image }}"

      - name: Download Canada OSM PBF
        shell: bash
        working-directory: work
        run: |
          set -euxo pipefail

          curl -L --retry 5 --retry-delay 10 \
            -o canada-latest.osm.pbf \
            "${{ github.event.inputs.pbf_url }}"

          curl -L --retry 5 --retry-delay 10 \
            -o canada-latest.osm.pbf.md5 \
            "${{ github.event.inputs.pbf_url }}.md5"

          md5sum -c canada-latest.osm.pbf.md5

          ls -lh

      - name: Select routing profile
        id: profile
        shell: bash
        run: |
          set -euxo pipefail

          PROFILE="/opt/car.lua"

          if [ "${{ github.event.inputs.use_custom_profile }}" = "yes" ] && [ -f "profiles/truck.lua" ]; then
            cp "profiles/truck.lua" "work/truck.lua"
            PROFILE="/data/truck.lua"
            echo "Using custom profile: profiles/truck.lua"
          else
            echo "Using OSRM default profile: /opt/car.lua"
          fi

          echo "profile=${PROFILE}" >> "$GITHUB_OUTPUT"

      - name: OSRM extract Canada
        shell: bash
        run: |
          set -euxo pipefail

          docker run --rm -t \
            -v "${PWD}/work:/data" \
            "${{ github.event.inputs.osrm_image }}" \
            osrm-extract \
              -p "${{ steps.profile.outputs.profile }}" \
              /data/canada-latest.osm.pbf

          echo "After extract:"
          df -h
          ls -lh work

      - name: Remove raw PBF to free space
        shell: bash
        run: |
          set -euxo pipefail
          rm -f work/canada-latest.osm.pbf work/canada-latest.osm.pbf.md5
          df -h

      - name: OSRM partition Canada
        shell: bash
        run: |
          set -euxo pipefail

          docker run --rm -t \
            -v "${PWD}/work:/data" \
            "${{ github.event.inputs.osrm_image }}" \
            osrm-partition \
              /data/canada-latest.osrm

          echo "After partition:"
          df -h
          ls -lh work

      - name: OSRM customize Canada
        shell: bash
        run: |
          set -euxo pipefail

          docker run --rm -t \
            -v "${PWD}/work:/data" \
            "${{ github.event.inputs.osrm_image }}" \
            osrm-customize \
              /data/canada-latest.osrm

          echo "After customize:"
          df -h
          ls -lh work

      - name: Test OSRM server
        shell: bash
        run: |
          set -euxo pipefail

          docker rm -f osrm-canada-test || true

          docker run -d \
            --name osrm-canada-test \
            -p 5000:5000 \
            -v "${PWD}/work:/data" \
            "${{ github.event.inputs.osrm_image }}" \
            osrm-routed \
              --algorithm mld \
              /data/canada-latest.osrm

          sleep 20

          curl --fail \
            "http://127.0.0.1:5000/route/v1/driving/-75.6972,45.4215;-79.3832,43.6532?overview=false"

          docker logs osrm-canada-test

          docker stop osrm-canada-test
          docker rm osrm-canada-test

      - name: Fix OSRM file permissions
        shell: bash
        run: |
          set -euxo pipefail

          sudo chown -R "$USER:$USER" work dist
          sudo find work -type d -exec chmod 755 {} \;
          sudo find work -type f -exec chmod 644 {} \;

          ls -lh work | head -50

      - name: Package OSRM map files
        shell: bash
        run: |
          set -euxo pipefail

          cd work

          tar --use-compress-program="zstd -T0 -10" \
            -cf ../dist/canada-osrm-v6-mld.tar.zst \
            canada-latest.osrm*

          cd ../dist

          sha256sum canada-osrm-v6-mld.tar.zst > canada-osrm-v6-mld.tar.zst.sha256

          split -b 1900M -d -a 3 \
            canada-osrm-v6-mld.tar.zst \
            canada-osrm-v6-mld.tar.zst.part-

          rm canada-osrm-v6-mld.tar.zst

          ls -lh

      - name: Upload OSRM Canada v6 files
        uses: actions/upload-artifact@v4
        with:
          name: canada-osrm-v6-mld-split-files
          path: |
            dist/canada-osrm-v6-mld.tar.zst.part-*
            dist/canada-osrm-v6-mld.tar.zst.sha256
          retention-days: 3
          compression-level: 0
